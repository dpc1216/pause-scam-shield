<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pause · App Prototype</title>
<meta name="description" content="Clickable mobile prototype of Pause, the scam shield for families.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/brand.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 30% 20%, #FBF9F5 0%, var(--ivory) 45%, #EDE7DD 100%);
    color: var(--ink); font-family: var(--font-body); overflow: hidden;
  }
  body.shot { background: transparent; }

  /* ---------- page chrome outside the phone ---------- */
  .topbar {
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; border-bottom: 1px solid var(--hairline); background: rgba(247,244,239,.8);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
  .brand .wordmark { font-size: 20px; }
  .brand .descriptor { font-size: 9px; }
  .top-actions { display: flex; gap: 10px; align-items: center; }
  .chip-btn {
    font: 700 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid var(--hairline); background: var(--porcelain); color: var(--ink);
    padding: 10px 14px; border-radius: 999px; cursor: pointer;
  }
  .chip-btn:hover { border-color: var(--champagne); }
  .chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--ivory); border-color: var(--ink); }
  .stage {
    height: calc(100% - 56px); display: flex; align-items: center; justify-content: center; gap: 48px;
    padding: 16px;
  }
  body.shot .stage { height: 100%; padding: 0; }
  body.shot .topbar, body.shot .notes { display: none !important; }

  .notes {
    width: 340px; align-self: center; border-left: 1px solid var(--champagne); padding: 6px 0 6px 28px;
    display: none;
  }
  .notes.open { display: block; }
  .notes .caps { color: var(--brass); }
  .notes h2 { font: 500 34px/1.05 var(--font-display); margin: 10px 0 18px; }
  .notes dl { margin: 0; }
  .notes dt { font: 700 11px/1 var(--font-body); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--graphite); margin-top: 18px; }
  .notes dd { margin: 6px 0 0; font-size: 15px; line-height: 1.5; }
  .notes .bmc { display: inline-block; margin: 4px 6px 0 0; padding: 5px 10px; border: 1px solid var(--hairline); border-radius: 999px; font-size: 12px; background: var(--porcelain); }

  /* ---------- the device ---------- */
  .device-wrap { position: relative; flex: none; }
  .device {
    position: absolute; top: 0; left: 0; width: 417px; height: 876px; transform-origin: top left;
    border-radius: 66px; background: #0E0D0C; padding: 12px;
    box-shadow: 0 0 0 1.5px #3A3632, 0 0 0 4px #1C1A18, 0 40px 80px rgba(23,22,21,.25), 0 8px 20px rgba(23,22,21,.15);
  }
  body.shot .device { box-shadow: 0 0 0 1.5px #3A3632, 0 0 0 4px #1C1A18; }
  .device::before, .device::after { /* side buttons */
    content: ""; position: absolute; width: 4px; background: #24211F; border-radius: 2px;
  }
  .device::before { left: -7px; top: 180px; height: 64px; box-shadow: 0 84px 0 #24211F; }
  .device::after { right: -7px; top: 230px; height: 100px; }
  .screen {
    --ts: 1; position: relative; width: 393px; height: 852px; border-radius: 54px; overflow: hidden;
    background: var(--ivory); font-size: calc(16px * var(--ts));
  }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 50; }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 40; display: flex; align-items: center;
    justify-content: space-between; padding: 6px 34px 0 46px; font: 700 16px/1 -apple-system, "Segoe UI", sans-serif; pointer-events: none;
  }
  .statusbar svg { display: block; }
  .screen.dark .statusbar { color: var(--ivory); }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 60; opacity: .85; pointer-events: none; }
  .screen.dark .homebar { background: var(--ivory); }

  /* ---------- app layout ---------- */
  .view { position: absolute; inset: 0; padding-top: 54px; display: flex; flex-direction: column; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 24px 28px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .has-tabs .scroll { padding-bottom: 110px; }
  .navrow { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; flex: none; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: inherit; }
  .iconbtn:hover { background: rgba(23,22,21,.05); }
  .navtitle { font: 700 .75em/1 var(--font-body); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--graphite); }

  h1.serif { font: 500 2.35em/1.02 var(--font-display); margin: .25em 0 .35em; letter-spacing: -.005em; }
  h2.serif { font: 500 1.7em/1.08 var(--font-display); margin: .2em 0 .4em; }
  h3.serif { font: 500 1.35em/1.1 var(--font-display); margin: 0 0 .25em; }
  .eyebrow { font: 700 .7em/1.2 var(--font-body); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--brass); }
  .muted { color: var(--graphite); }
  p { line-height: 1.5; margin: .5em 0; }
  .small { font-size: .875em; }
  .rule { height: 1px; background: var(--hairline); border: 0; margin: 20px 0; }
  .gold-rule { width: 36px; height: 1px; background: var(--champagne); margin: 18px 0; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px;
    border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--ivory);
    font: 700 1em/1.2 var(--font-body); letter-spacing: .02em; cursor: pointer; padding: 0 22px; text-align: center;
  }
  .btn:active { transform: scale(.985); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--hairline); }
  .btn.ghost:hover { border-color: var(--champagne); }
  .btn.danger { background: var(--scam); border-color: var(--scam); }
  .btn + .btn { margin-top: 10px; }
  .linkbtn { background: none; border: 0; color: var(--brass); font: 700 .95em var(--font-body); cursor: pointer; padding: 12px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--champagne); }

  .card { background: var(--porcelain); border: 1px solid var(--hairline); border-radius: 20px; padding: 18px; }
  .card + .card, .card + .row, .row + .card { margin-top: 12px; }
  .row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--porcelain);
    border: 1px solid var(--hairline); border-radius: 18px; padding: 16px; cursor: pointer; color: inherit; font: inherit;
  }
  .row + .row { margin-top: 10px; }
  .row:hover { border-color: var(--champagne); }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 700; }
  .row .s { color: var(--graphite); font-size: .875em; margin-top: 2px; line-height: 1.35; }
  .glyph { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--hairline); display: grid; place-items: center; flex: none; color: var(--ink); background: var(--ivory); }
  .row.selected { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .alert-row { border-left: 3px solid var(--scam); }

  .meter { height: 3px; background: var(--linen); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .meter i { display: block; height: 100%; background: var(--champagne); }

  /* tabs */
  .tabs {
    position: absolute; left: 0; right: 0; bottom: 0; height: 92px; padding: 8px 10px 26px; z-index: 30;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    background: rgba(247,244,239,.92); backdrop-filter: blur(12px); border-top: 1px solid var(--hairline);
  }
  .tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; color: var(--graphite); font: 700 10px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; }
  .tab.on { color: var(--ink); }
  .tab.on::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--champagne); margin-top: 1px; }
  .tab.center .disc { width: 58px; height: 58px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; margin-top: -26px; box-shadow: 0 8px 22px rgba(23,22,21,.25); }
  .tab.center { color: var(--ink); }

  /* verdict */
  .verdict-word { font: 500 4.2em/0.95 var(--font-display); margin: .1em 0 .1em; }
  .v-scam .verdict-word { color: var(--scam); }
  .v-caution .verdict-word { color: var(--caution); }
  .v-safe .verdict-word { color: var(--safe); }
  .reasons { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: r; }
  .reasons li { counter-increment: r; display: grid; grid-template-columns: 34px 1fr; padding: 14px 0; border-top: 1px solid var(--hairline); line-height: 1.45; }
  .reasons li::before { content: counter(r, upper-roman) "."; font: 500 1.25em/1.1 var(--font-display); color: var(--brass); }
  .todo { border-radius: 18px; padding: 16px 18px; margin-top: 16px; }
  .v-scam .todo { background: var(--scam-wash); }
  .v-caution .todo { background: var(--caution-wash); }
  .v-safe .todo { background: var(--safe-wash); }

  .bubble { background: var(--linen); border-radius: 20px 20px 20px 6px; padding: 14px 16px; line-height: 1.45; }
  .bubble .from { font-size: .75em; color: var(--graphite); margin-bottom: 6px; font-weight: 700; letter-spacing: .04em; }
  .bubble a { color: #2F5FA7; }
  .mail { background: var(--porcelain); border: 1px solid var(--hairline); border-radius: 16px; padding: 16px; line-height: 1.45; }
  .qr { width: 150px; height: 150px; margin: 4px auto 10px; display: block; }

  /* analyzing */
  .analyzing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 32px; }
  .spin-ring { animation: draw 1.6s ease-in-out infinite; transform-origin: center; }
  @keyframes draw { 0% { stroke-dashoffset: 182; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -182; } }
  .steps { list-style: none; padding: 0; margin: 26px 0 0; text-align: left; }
  .steps li { padding: 8px 0; color: var(--graphite); opacity: .35; transition: opacity .3s; }
  .steps li.on { opacity: 1; color: var(--ink); }

  /* dark call screen */
  .screen.dark { background: var(--onyx); color: var(--ivory); }
  .call { flex: 1; display: flex; flex-direction: column; padding: 20px 24px 40px; }
  .call .eyebrow { color: var(--champagne); }
  .call .who { font: 500 2.2em/1.05 var(--font-display); margin: 8px 0 2px; }
  .transcript { margin-top: 22px; border-left: 1px solid var(--champagne); padding: 4px 0 4px 16px; line-height: 1.5; min-height: 120px; }
  .transcript .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--champagne); }
  @keyframes blink { 50% { opacity: 0; } }
  .warn { margin-top: 18px; background: #221F1C; border: 1px solid #3A342D; border-radius: 18px; padding: 16px; }
  .call .btn { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  .call .btn.ghost { background: transparent; color: var(--ivory); border-color: #4A443D; }

  /* sheets + toast */
  .sheet-back { position: absolute; inset: 0; background: rgba(20,19,18,.35); z-index: 70; animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0; } }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ivory); border-radius: 28px 28px 0 0; padding: 12px 24px 40px; z-index: 71; animation: up .28s ease; max-height: 86%; overflow-y: auto; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--hairline); margin: 0 auto 14px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .toast { position: absolute; left: 16px; right: 16px; top: 60px; z-index: 80; background: var(--ink); color: var(--ivory); border-radius: 18px; padding: 14px 16px; font-size: .9em; line-height: 1.4; display: flex; gap: 12px; align-items: flex-start; animation: drop .3s ease; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }

  .field { display: block; width: 100%; border: 1px solid var(--hairline); background: var(--porcelain); border-radius: 14px; padding: 15px 16px; font: 1em var(--font-body); color: var(--ink); }
  .field:focus { outline: 2px solid var(--champagne); outline-offset: 1px; }
  label.lbl { display: block; font: 700 .72em var(--font-body); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--graphite); margin: 16px 0 8px; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { border: 1px solid var(--hairline); background: var(--porcelain); border-radius: 14px; padding: 14px 6px; cursor: pointer; font-family: var(--font-display); font-weight: 500; color: var(--ink); }
  .seg button.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .toggle2 { display: inline-flex; border: 1px solid var(--hairline); border-radius: 999px; padding: 3px; background: var(--porcelain); }
  .toggle2 button { border: 0; background: none; border-radius: 999px; padding: 8px 14px; font: 700 .8em var(--font-body); cursor: pointer; color: var(--graphite); }
  .toggle2 button.on { background: var(--ink); color: var(--ivory); }

  .plan { border: 1px solid var(--hairline); background: var(--porcelain); border-radius: 22px; padding: 18px; margin-top: 12px; position: relative; }
  .plan.featured { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .plan .price { font: 500 2.2em/1 var(--font-display); }
  .plan ul { margin: 10px 0 0; padding: 0; list-style: none; }
  .plan li { padding: 5px 0 5px 22px; position: relative; font-size: .92em; }
  .plan li::before { content: ""; position: absolute; left: 2px; top: .8em; width: 9px; height: 1px; background: var(--champagne); }
  .ribbon { position: absolute; top: -10px; right: 16px; background: var(--ink); color: var(--ivory); font: 700 10px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; }

  .chatlog { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 12px 15px; border-radius: 18px; line-height: 1.45; font-size: .95em; }
  .msg.bot { background: var(--porcelain); border: 1px solid var(--hairline); border-bottom-left-radius: 6px; }
  .msg.me { background: var(--ink); color: var(--ivory); align-self: flex-end; border-bottom-right-radius: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { border: 1px solid var(--hairline); background: var(--porcelain); border-radius: 999px; padding: 10px 14px; font: .85em var(--font-body); cursor: pointer; color: var(--ink); text-align: left; }
  .chip:hover { border-color: var(--champagne); }

  .dots { display: flex; gap: 8px; margin-top: 10px; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--champagne); display: block; }
  .dots i.on { background: var(--champagne); }
  .quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }

  .weather { background: var(--onyx); color: var(--ivory); border-radius: 22px; padding: 20px; }
  .weather .eyebrow { color: var(--champagne); }
  .weather h3 { font: 500 1.6em/1.1 var(--font-display); margin: 8px 0 6px; }
  .trend { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--hairline); }
  .trend .n { font: 500 1.3em var(--font-display); color: var(--brass); }
  .trend .c { font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--scam); font-size: .8em; font-weight: 700; }

  .lock-card { text-align: center; padding: 26px 20px; }
  .reveal { user-select: none; cursor: pointer; border: 1px dashed var(--champagne); border-radius: 14px; padding: 14px; text-align: center; font: 500 1.5em var(--font-display); letter-spacing: .06em; }
  .member-av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 500 1.15em var(--font-display); background: var(--linen); flex: none; }
  .member-av.gold { background: transparent; border: 1px solid var(--champagne); color: var(--brass); }
  .ticks { list-style: none; padding: 0; margin: 8px 0 0; }
  .ticks li { display: flex; gap: 10px; align-items: center; padding: 7px 0; font-size: .95em; }

  @media (max-width: 900px) { .notes, #notesBtn { display: none !important; } .stage { gap: 0; } }
  @media (max-width: 560px) { .topbar .descriptor, .hide-sm { display: none; } .topbar { padding: 0 12px; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html" aria-label="Pause home">
    <svg class="pause-mark" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring" cx="32" cy="32" r="29" stroke-width="2"/><rect class="bar" x="24.6" y="21" width="4.6" height="22" rx="1.2"/><rect class="bar" x="34.8" y="21" width="4.6" height="22" rx="1.2"/></svg>
    <span><span class="wordmark">Pause</span><br><span class="descriptor">Scam Shield</span></span>
  </a>
  <div class="top-actions">
    <span class="caps hide-sm" style="color:var(--graphite)">Clickable prototype</span>
    <button class="chip-btn" id="notesBtn" aria-pressed="false">Why this screen?</button>
    <button class="chip-btn" id="restartBtn">Restart</button>
  </div>
</header>

<main class="stage">
  <div class="device-wrap" id="wrap">
    <div class="device" id="device">
      <div class="screen" id="screen">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span style="display:flex;gap:6px;align-items:center">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5ZM3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.3 1.3a4.7 4.7 0 0 0-6.6 0L3.4 6.8ZM1.2 4.6a9.6 9.6 0 0 1 13.6 0l-1.3 1.3a7.8 7.8 0 0 0-11 0L1.2 4.6Z" fill="currentColor"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="17" height="8" rx="2" fill="currentColor"/><rect x="24.5" y="4.5" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".5"/></svg>
          </span>
        </div>
        <div id="app"></div>
        <div class="homebar"></div>
      </div>
    </div>
  </div>

  <aside class="notes" id="notes" aria-live="polite">
    <div class="caps">Design note</div>
    <h2 id="nTitle"></h2>
    <dl>
      <dt>Why it exists</dt><dd id="nWhy"></dd>
      <dt>Design choice</dt><dd id="nChoice"></dd>
      <dt>Business Model Canvas</dt><dd id="nBmc"></dd>
    </dl>
  </aside>
</main>

<script>
/* ======================================================================
   Pause prototype. One state object, one render function per screen.
   Every screen also carries a design note (shown with "Why this screen?").
   ====================================================================== */
const params = new URLSearchParams(location.search);
const SHOT = params.get('shot') === '1';
if (SHOT) document.body.classList.add('shot');

const fresh = () => ({
  plan: params.get('plan') || 'family',   // 'free' | 'plus' | 'family'
  provider: null,                          // set when a partner code is used
  setupFor: null,
  ts: Number(params.get('ts')) || 1,
  checksLeft: 5,
  guardian: 'Daniel',
  codeWord: 'Mango sunset',
  sample: params.get('sample') || 'sunpass',
  billing: 'year',
  streak: 4,
  quiz: { i: 0, score: 0, answered: null },
  moneyResolved: false,
  booked: null,
  chat: [],
});
let S = fresh();
let stack = [];
let current = null;

const $app = document.getElementById('app');
const $screen = document.getElementById('screen');

/* ---------- icons (1.5px line, champagne-free so they read on any surface) ---------- */
const I = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',

function qrPattern() {
  // deterministic faux QR (not scannable on purpose) — finder squares + seeded noise
  let s = '', seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#171615"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#171615"/>`;
  s += '<rect width="29" height="29" fill="#fff"/>';
  for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) {
    const inF = (x < 8 && y < 8) || (x > 20 && y < 8) || (x < 8 && y > 20);
    if (!inF && rnd() > 0.55) s += `<rect x="${x}" y="${y}" width="1" height="1" fill="#171615"/>`;
  }
  return s + finder(0, 0) + finder(22, 0) + finder(0, 22);
}

  el.innerHTML = `<span style="flex:none;margin-top:1px">${mark(20, true)}</span><span>${html}</span>`;
  $screen.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function sheet(html) {
  closeSheet();
  const back = document.createElement('div'); back.className = 'sheet-back'; back.dataset.closeSheet = '';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = `<div class="grab"></div>${html}`;
  $screen.append(back, sh);
}

/* ---------- dates: always current, so the prototype never shows a past week ---------- */
function dayLabel(d) { return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); }
function thisMonday() { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
function nextSunday(weeksAhead) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7) + 7 * weeksAhead); return d; }

/* ---------- render + navigation ---------- */
const TAB_SCREENS = ['home', 'radar', 'circle', 'learn'];
function render(id) {
  current = id;
  const dark = id === 'call' || id === 'codecheck';
  $screen.classList.toggle('dark', dark);
  $screen.style.setProperty('--ts', S.ts);
  closeSheet();
  const locked = (id === 'circle' || id === 'money') && !isFamily();
  const html = id === 'money' && !isFamily() ? lockedView('home') : V[id]();
  $app.innerHTML = `<section class="view ${TAB_SCREENS.includes(id) ? 'has-tabs' : ''}">${html}</section>`;
  const n = NOTES[locked ? 'locked' : id] || NOTES.home;
  document.getElementById('nTitle').textContent = n[0];
  document.getElementById('nWhy').textContent = n[1];
  document.getElementById('nChoice').textContent = n[2];
  document.getElementById('nBmc').innerHTML = n[3].map(b => `<span class="bmc">${b}</span>`).join('');
  after(id);
}
function go(id, push = true) { if (push && current) stack.push(current); render(id); }
function back() { render(stack.pop() || 'home'); }
function tab(id) { stack = []; render(id); }

let timers = [];
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function after(id) {
  clearTimers();
  if (id === 'analyzing') {
    const lis = [...document.querySelectorAll('#steps li')];
    lis.forEach((li, i) => timers.push(setTimeout(() => li.classList.add('on'), 250 + i * 550)));
    if (!SHOT) timers.push(setTimeout(() => { stack = stack.filter(s => s !== 'analyzing'); render('verdict'); }, 2100));
    else lis.forEach(li => li.classList.add('on'));
  }
  if (id === 'call') {
    const line = 'Grandma? It\'s Leo. I had an accident and I need money for bail right now. Please don\'t tell Mom.';
    const el = document.getElementById('tx'); let i = 0;
    const tick = () => { el.textContent = '"' + line.slice(0, i) + (i >= line.length ? '"' : ''); if (i++ < line.length) timers.push(setTimeout(tick, 28)); else { el.classList.remove('typing'); document.getElementById('warn').style.visibility = 'visible'; } };
    if (SHOT) { i = line.length; } tick();
  }
  const rv = document.getElementById('reveal');
  if (rv) {
    const show = () => rv.textContent = S.codeWord, hide = () => rv.textContent = 'Hold to reveal';
    rv.addEventListener('pointerdown', show); ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => rv.addEventListener(e, hide));
  }
  const log = document.getElementById('chatlog'); if (log) log.parentElement.scrollTop = 1e6;
}

/* ---------- actions ---------- */
const A = {
  setupFor(v) { S.setupFor = v; S.plan = v === 'me' ? 'free' : 'family'; go('text'); },
  ts(v) { S.ts = Number(v); render(current); },
  finishSetup() { stack = []; render('home'); toast('You\'re protected. Welcome to Pause.'); },
  saveGuardian() { S.guardian = (document.getElementById('gname').value || 'Daniel').trim(); toast(`Invitation sent to ${S.guardian}.`); go('codeword'); },
  saveCode() { S.codeWord = (document.getElementById('cw').value || 'Mango sunset').trim(); stack = []; render('home'); toast('Your family is protected. Welcome to Pause.'); },
  pick(v) { S.sample = v; go('input'); },
  runCheck() {
    if (S.plan === 'free') {
      if (S.checksLeft <= 0) return go('plans');
      S.checksLeft--;
    }
    go('analyzing');
  },
  scamLink() { toast("Pause held this link. Links in texts are how this scam works. Tap <b>Check it</b> and we'll look first.", 4200); },
  report() { toast('Reported. Our team confirms reports within hours, then warns everyone nearby.'); },
  tellGuardian() { toast(`${S.guardian} was told a scam was blocked. He can't see the message itself.`); },
  done() { stack = []; render('home'); },
  declineCall() { stack = []; render('home'); toast('Call declined. Calling Leo at his saved number…'); },
  codeYes() { stack = []; render('home'); toast("Good. It's most likely really Leo. If he asks for money, call his parents too."); },
  codeNo() { stack = []; render('home'); toast(`Hang up. That was a scam. ${isFamily() ? S.guardian + ' has been alerted, and the call was' : 'The call was'} reported to Scam Radar.`, 4200); },
  moneyAsked() {
    sheet(`<div class="eyebrow">You did the right thing</div><h2 class="serif" style="margin-top:8px">Stop here. Don't share the card numbers.</h2>
      <ol class="reasons"><li><span>Keep the cards and the receipts.</span></li><li><span>Call the company on the back of each card and tell them it was a scam.</span></li><li><span>Report it at ReportFraud.ftc.gov. We can do it with you.</span></li></ol>
      <p class="small muted">${S.guardian} has been told a risky payment was flagged. Not the amount, unless you choose to share it.</p>
      <button class="btn" data-act="closeMoney">Got it</button>`);
  },
  closeMoney() { S.moneyResolved = true; closeSheet(); stack = []; render('home'); },
  moneyMine() { S.moneyResolved = true; stack = []; render('home'); toast("Got it. We won't flag these again."); },
  invite() { toast('Invite link ready to share. 3 places left on your plan.'); },
  reportSheet() {
    sheet(`<div class="eyebrow">Report a scam</div><h2 class="serif" style="margin-top:8px">What did you receive?</h2>
      ${[['msg', 'A text or email'], ['phone', 'A phone call'], ['qr', 'A QR code or sticker'], ['card', 'A payment request']].map(([i, t]) => row(I[i], t, '', 'data-act="reported"')).join('')}`);
  },
  reported() { closeSheet(); toast('Thank you. Every confirmed report makes Pause smarter for everyone.'); },
  quiz(v) { S.quiz.answered = v; if (v === QUIZ[S.quiz.i].answer) S.quiz.score++; render('learn'); },
  quizNext() { S.quiz.i++; S.quiz.answered = null; if (S.quiz.i >= QUIZ.length) S.streak = Math.min(6, S.streak + 1); render('learn'); },
  quizReset() { S.quiz = { i: 0, score: 0, answered: null }; render('learn'); },
  ask(v) {
    S.chat.push({ me: true, t: v }); render('assistant');
    const log = document.getElementById('chatlog'); const t = document.createElement('div'); t.className = 'msg bot'; t.textContent = '…'; log.appendChild(t);
    timers.push(setTimeout(() => { S.chat.push({ me: false, t: ANSWERS[v] }); render('assistant'); }, 700));
  },
  billing(v) { S.billing = v; render('plans'); },
  choose(v) { S.plan = v; S.checksLeft = 5; toast(v === 'family' ? 'Welcome to Pause Family. Family Circle and Money Guard are on.' : 'Welcome to Pause Plus. Unlimited checks are on.'); stack = []; render('home'); },
  partnerSheet() {
    sheet(`<div class="eyebrow">Partner code</div><h2 class="serif" style="margin-top:8px">Get Pause through your bank or employer.</h2>
      <p class="muted small">Many credit unions, banks, and employers offer Pause Family free to their members.</p>
      <label class="lbl" for="pc">Your code</label><input class="field" id="pc" value="CU-PAUSE-2027" style="letter-spacing:.08em">
      <button class="btn" style="margin-top:16px" data-act="applyCode">Apply code</button>`);
  },
  applyCode() { S.plan = 'family'; S.provider = 'your credit union'; closeSheet(); stack = []; render('home'); toast('Code accepted. Pause Family is provided by your credit union.'); },
  book(v) { S.booked = v; render('setup'); },
  demoPlan(v) { S.plan = v; S.checksLeft = 5; S.provider = null; render('account'); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-back],[data-tab],[data-close-sheet]');
  if (!t || !$screen.contains(t)) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.hasAttribute('data-close-sheet')) return closeSheet();
  if (t.hasAttribute('data-back')) return back();
  if (t.dataset.tab) return tab(t.dataset.tab);
  if (t.dataset.act && A[t.dataset.act]) A[t.dataset.act](t.dataset.v);
  if (t.dataset.go) go(t.dataset.go);
});

/* ---------- frame scaling + page controls ---------- */
const FW = 417, FH = 876;
function fit() {
  const wrap = document.getElementById('wrap');
  const vw = Math.min(innerWidth, document.documentElement.clientWidth || innerWidth);
  const vh = Math.min(innerHeight, document.documentElement.clientHeight || innerHeight);
  const availH = (SHOT ? vh : vh - 56) - 32;
  const availW = vw - 32;
  const s = SHOT ? 1 : Math.min(1, availH / FH, availW / FW);
  document.getElementById('device').style.transform = `scale(${s})`;
  wrap.style.width = FW * s + 'px'; wrap.style.height = FH * s + 'px';
}
['resize', 'orientationchange', 'load'].forEach(e => addEventListener(e, fit));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
new ResizeObserver(fit).observe(document.documentElement);
fit();

const notesBtn = document.getElementById('notesBtn');
const setNotes = on => { document.getElementById('notes').classList.toggle('open', on); notesBtn.setAttribute('aria-pressed', on); };
notesBtn.addEventListener('click', () => setNotes(notesBtn.getAttribute('aria-pressed') !== 'true'));
document.getElementById('restartBtn').addEventListener('click', () => { S = fresh(); S.plan = 'family'; stack = []; render('welcome'); });
if (params.get('notes') === '1') setNotes(true);

render(params.get('screen') || 'welcome');
</script>
